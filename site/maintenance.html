<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>{{title}} — {{name}}</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/shared/fonts/fonts.css">
    <link rel="stylesheet" href="/css/maintenance.css">
    <script type="module" src="/js/maintenance.js"></script>
  </head>
  <body style="--accent: {{accent}}">
    <main class="update" role="status" aria-live="polite">
      <div class="update__spinner" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <p class="update__os">{{os}}</p>
      <h1 class="update__title">{{title}}</h1>
      <p class="update__message">{{message}}</p>
      <p class="update__eta">{{eta}}</p>
      <p class="update__hint">Ne fermez pas cette page : elle se rechargera toute seule.</p>
    </main>
  </body>
</html>
